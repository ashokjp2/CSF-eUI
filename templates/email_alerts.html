{% extends "base.html" %}
{% block page_title %}Email Alerts{% endblock %}

{% block content %}
<p class="text-muted" style="margin-bottom:15px">Configure LFD email notifications in csf.conf</p>

        <div class="panel panel-default">
            <div class="panel-heading"><h4 class="panel-title" style="margin:0">Alert Settings</h4></div>
            <div class="panel-body" id="settings-form">
                <p class="text-muted">Loading...</p>
            </div>
        </div>

        <div class="panel panel-info">
            <div class="panel-heading"><h4 class="panel-title" style="margin:0">Test Email</h4></div>
            <div class="panel-body">
                <div class="input-group">
                    <input type="email" class="form-control" id="test-email" placeholder="recipient@example.com">
                    <span class="input-group-btn">
                        <button class="btn btn-info" id="btn-test-email">
                            <span class="glyphicon glyphicon-send"></span> Send Test
                        </button>
                    </span>
                </div>
            </div>
        </div>
{% endblock %}

{% block scripts %}
<script>
$(function() {
    function load() {
        $.getJSON('/api/email-alerts', function(data) {
            var html = '';
            data.forEach(function(s) {
                var inputType = (s.key.indexOf('_TO') > -1 || s.key.indexOf('_FROM') > -1) ? 'text' : 'text';
                var isToggle = (s.value === '0' || s.value === '1') && s.key !== 'LF_ALERT_TO' && s.key !== 'LF_ALERT_FROM';
                html += '<div class="form-group" style="border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px">' +
                    '<label>' + s.label + ' <code style="font-size:10px">' + s.key + '</code></label>' +
                    '<p class="help-block" style="margin-bottom:5px">' + s.description + '</p>';
                if (isToggle) {
                    var checked = s.value === '1' ? ' checked' : '';
                    html += '<label class="checkbox-inline"><input type="checkbox" class="alert-toggle" data-key="' + s.key + '"' + checked + '> Enabled</label>';
                } else {
                    html += '<div class="input-group"><input type="text" class="form-control input-sm alert-input" data-key="' + s.key + '" value="' + (s.value || '') + '">' +
                        '<span class="input-group-btn"><button class="btn btn-sm btn-primary btn-save-setting" data-key="' + s.key + '">Save</button></span></div>';
                }
                html += '</div>';
            });
            $('#settings-form').html(html);
        }).fail(function() { showToast('Failed to load settings', 'danger'); });
    }
    load();

    $(document).on('change', '.alert-toggle', function() {
        var key = $(this).data('key');
        var val = $(this).is(':checked') ? '1' : '0';
        $.post('/api/email-alerts', JSON.stringify({key: key, value: val}), function(r) {
            showToast(r.message || 'Updated', r.success ? 'success' : 'danger');
        }, 'json');
    });

    $(document).on('click', '.btn-save-setting', function() {
        var key = $(this).data('key');
        var val = $('input[data-key="' + key + '"]').val().trim();
        $.post('/api/email-alerts', JSON.stringify({key: key, value: val}), function(r) {
            showToast(r.message || 'Updated', r.success ? 'success' : 'danger');
        }, 'json');
    });

    $('#btn-test-email').on('click', function() {
        var email = $('#test-email').val().trim();
        if (!email) { showToast('Enter an email address', 'warning'); return; }
        $(this).prop('disabled', true);
        var btn = $(this);
        $.post('/api/email-alerts/test', JSON.stringify({email: email}), function(r) {
            showToast(r.message || r.error, r.success ? 'success' : 'danger');
            btn.prop('disabled', false);
        }, 'json').fail(function() { showToast('Failed', 'danger'); btn.prop('disabled', false); });
    });
});
</script>
{% endblock %}
