{% extends "base.html" %}
{% block page_title %}Log Viewer{% endblock %}

{% block content %}
<p class="text-muted" style="margin-bottom:15px">Live view of firewall and system logs with filtering</p>

<!-- Controls -->
<div class="panel panel-default">
    <div class="panel-body">
        <div class="row">
            <div class="col-md-3">
                <label>Log File</label>
                <select class="form-control" id="log-select">
                    {% for key, path in available_logs.items() %}
                    <option value="{{ key }}" {{ 'selected' if key == current_log }}>{{ key }} ({{ path }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label>Filter Category</label>
                <select class="form-control" id="cat-filter">
                    <option value="all">All</option>
                    <option value="block">Blocks</option>
                    <option value="login">Login/SSH</option>
                    <option value="process">Process/Tracking</option>
                    <option value="service">Service Events</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="col-md-4">
                <label>Search</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="log-search" placeholder="Search by IP, text...">
                    <span class="input-group-btn">
                        <button class="btn btn-primary" onclick="refreshLog()">
                            <span class="glyphicon glyphicon-search"></span>
                        </button>
                    </span>
                </div>
            </div>
            <div class="col-md-2">
                <label>Lines</label>
                <select class="form-control" id="log-lines">
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
        </div>
        <div class="row" style="margin-top:10px">
            <div class="col-md-8">
                <div id="log-stats" class="text-muted" style="font-size:12px"></div>
            </div>
            <div class="col-md-4 text-right">
                <label class="checkbox-inline" style="margin-right:15px">
                    <input type="checkbox" id="auto-refresh"> Auto-refresh (10s)
                </label>
                <button class="btn btn-default btn-sm" onclick="refreshLog()">
                    <span class="glyphicon glyphicon-refresh"></span> Refresh
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Log entries -->
<div class="panel panel-default">
    <div class="panel-body" style="padding:0">
        <div id="log-entries" style="max-height:600px; overflow-y:auto; font-family:monospace; font-size:12px">
            <div class="text-center text-muted" style="padding:40px">
                <span class="glyphicon glyphicon-hourglass"></span> Loading...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var _autoTimer = null;

function refreshLog() {
    var logname = $('#log-select').val();
    var category = $('#cat-filter').val();
    var search = $('#log-search').val();
    var lines = $('#log-lines').val();

    $('#log-entries').html('<div class="text-center text-muted" style="padding:20px"><span class="glyphicon glyphicon-hourglass"></span> Loading...</div>');

    $.getJSON('/api/logs/view', {
        log: logname,
        lines: lines,
        search: search,
        category: category,
    }, function(data) {
        if (data.error) {
            $('#log-entries').html('<div class="alert alert-danger" style="margin:15px">' + data.error + '</div>');
            return;
        }
        renderLog(data);
    }).fail(function() {
        $('#log-entries').html('<div class="alert alert-danger" style="margin:15px">Failed to load log</div>');
    });
}

function renderLog(data) {
    var html = '';
    if (!data.entries || data.entries.length === 0) {
        html = '<div class="text-center text-muted" style="padding:40px">No log entries found</div>';
    } else {
        data.entries.forEach(function(e, i) {
            var cls = '';
            if (e.severity === 'danger') cls = 'background:#fdf2f2; border-left:3px solid #d9534f';
            else if (e.severity === 'warning') cls = 'background:#fef9f0; border-left:3px solid #f0ad4e';
            else if (e.severity === 'success') cls = 'background:#f0fdf0; border-left:3px solid #5cb85c';
            else cls = 'border-left:3px solid #ddd';

            var text = $('<span>').text(e.text).html();
            if (e.ip) {
                text = text.replace(e.ip, '<a href="#" class="log-ip-link" data-ip="' + e.ip + '" title="Look up ' + e.ip + '">' + e.ip + '</a>');
            }

            var catBadge = '';
            if (e.category !== 'other') {
                var catColors = {block:'danger', login:'warning', process:'info', service:'success'};
                catBadge = ' <span class="label label-' + (catColors[e.category]||'default') + '" style="font-size:9px">' + e.category + '</span>';
            }

            html += '<div style="padding:4px 10px; ' + cls + '; border-bottom:1px solid #f0f0f0">'
                + '<span class="text-muted" style="font-size:10px">' + (i+1) + '</span> '
                + text + catBadge + '</div>';
        });
    }
    $('#log-entries').html(html);
    $('#log-entries').scrollTop($('#log-entries')[0].scrollHeight);

    // Stats
    var statHtml = '<strong>' + data.total + '</strong> entries';
    if (data.stats) {
        var parts = [];
        for (var k in data.stats) {
            if (data.stats[k] > 0) parts.push(k + ': ' + data.stats[k]);
        }
        if (parts.length) statHtml += ' | ' + parts.join(' | ');
    }
    statHtml += ' | <em>' + data.path + '</em>';
    $('#log-stats').html(statHtml);

    // IP click handlers
    $('.log-ip-link').on('click', function(e) {
        e.preventDefault();
        var ip = $(this).data('ip');
        window.open('/api/ip/lookup?ip=' + encodeURIComponent(ip), '_blank');
    });
}

$(function() {
    refreshLog();

    $('#log-select, #cat-filter, #log-lines').on('change', refreshLog);
    $('#log-search').on('keypress', function(e) {
        if (e.which === 13) refreshLog();
    });

    $('#auto-refresh').on('change', function() {
        if ($(this).is(':checked')) {
            _autoTimer = setInterval(refreshLog, 10000);
        } else {
            clearInterval(_autoTimer);
        }
    });
});
</script>
{% endblock %}
